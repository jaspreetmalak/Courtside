[package]
name = "shared"
version = "0.1.0"
edition = "2021"

# Pure DTO/protocol crate shared by server and client.
# Must stay free of server-only deps (axum, sea-orm) and UI deps (waterui).
# Deps are spelled out (not workspace-inherited) so the crate builds even if
# the client is ever split into its own workspace.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
