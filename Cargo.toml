[workspace]
members = [
    "server",
    "shared",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde_json = "1"

[workspace.dependencies.chrono]
version = "0.4"
features = ["serde"]

[workspace.dependencies.serde]
version = "1"
features = ["derive"]

[workspace.dependencies.uuid]
version = "1"
features = [
    "v4",
    "serde",
]

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 2
debug = 0
